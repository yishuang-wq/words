<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼字機資料工廠 V3.0 (字根偵探版)</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #e8f5e9; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2e7d32; text-align: center; }
        .step { margin-bottom: 25px; padding: 15px; background: #fffde7; border-left: 5px solid #fbc02d; border-radius: 4px; }
        textarea { width: 100%; height: 150px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; }
        button { background: #2e7d32; color: white; border: none; padding: 10px 20px; font-size: 1.1rem; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #1b5e20; }
        .copy-hint { color: #e65100; font-weight: bold; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏭 資料工廠 V3.0 (含字根)</h1>
    <p style="text-align:center; color:#666;">自動分析字根字首 -> 拼字機格式</p>

    <div class="step">
        <h3>步驟 1：貼上原始資料</h3>
        <textarea id="raw-input" placeholder="例如：
attract 吸引
predict 預測"></textarea>
        <button onclick="generateCommand()">🧙‍♂️ 產生 AI 指令</button>
    </div>

    <div class="step" id="step2" style="display:none;">
        <h3>步驟 2：複製指令給 AI</h3>
        <textarea id="ai-prompt" readonly></textarea>
        <button onclick="copyPrompt()">📋 複製指令</button>
        <span class="copy-hint" id="copy-msg">已複製！請去 ChatGPT 貼上。</span>
        <div style="margin-top:10px;">
            <a href="https://chat.openai.com/" target="_blank" style="color:#2e7d32; text-decoration:none;">👉 前往 ChatGPT</a>
        </div>
    </div>

    <div class="step">
        <h3>步驟 3：取得結果</h3>
        <p>AI 會回傳格式：<code>單字=音節=中文=例句=字根解析</code></p>
        <p>範例：<code>predict=pre-dict=預測=I can predict the weather.=pre(預先)+dict(說)</code></p>
    </div>
</div>

<script>
    function generateCommand() {
        const rawText = document.getElementById('raw-input').value.trim();
        if (!rawText) return alert("請先貼上資料！");

        const prompt = `
你是英語教學專家。請將以下單字資料整理成「拼字學習機」專用格式。

目標格式：
單字=音節=中文=例句=字根解析
(注意：最後多了一個「字根解析」欄位)

處理規則：
1. 【單字/音節/中文】：照常處理，音節用 "-" 分隔。
2. 【例句】：優先使用原文例句，若無則造一個簡單句。
3. 【字根解析】(重點)：
   - 請分析該單字的字根、字首、字尾。
   - 格式範例： "pre(前) + dict(說) -> 預先說出"
   - 用語請簡潔，適合國中生理解。
   - 如果是簡單單字無明顯字根(如 cat, dog)，請填寫 "無" 或簡單關聯記憶法。

以下是原始資料：
${rawText}
`;
        document.getElementById('ai-prompt').value = prompt;
        document.getElementById('step2').style.display = 'block';
        document.getElementById('step2').scrollIntoView({behavior: 'smooth'});
    }

    function copyPrompt() {
        const t = document.getElementById("ai-prompt");
        t.select(); document.execCommand("copy");
        document.getElementById('copy-msg').style.display = 'inline';
    }
</script>
</body>
</html>
